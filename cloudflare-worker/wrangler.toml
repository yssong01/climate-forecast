name = "climate-forecast-refresh-trigger"
main = "src/index.js"
compatibility_date = "2024-01-01"

# GitHub Actions 의 schedule 트리거가 15분 주기를 못 지켜서(실측 지연
# 20~81분, README/CLAUDE.md 참고) 대신 이 워커가 정시에 워크플로를
# 깨운다. GITHUB_PAT 은 `wrangler secret put GITHUB_PAT` 로 별도 등록—
# 이 파일에는 절대 평문으로 넣지 않는다.
[triggers]
crons = ["*/15 * * * *"]
