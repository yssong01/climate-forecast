name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 수치 검증 2종. API 키·GPU 불필요하고 순수 텐서/배열 연산만 다루므로
  # 시크릿 없이 안전하게 돌린다.
  #   test_phase34.py — Gram-Schmidt 직교화, gradient 흐름, dying-clamp 회귀
  #   test_phase36.py — 경보 보상표, 피로 누적, MDP 성질, GAE 종료 부트스트랩
  # 두 스크립트 모두 실패 시 종료 코드 1을 반환한다. 예전에는 결과를 출력만
  # 하고 항상 0으로 끝나서, 항목이 깨져도 이 잡이 초록불이었다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU-only dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt

      - name: Run Phase 3-4 numerical stability tests
        run: python test_phase34.py

      - name: Run Phase 3-6 alarm gate tests
        run: python test_phase36.py

  # Dockerfile 이 실제로 빌드되는지 확인 — 체크포인트는 런타임 마운트 대상이라
  # 빌드 단계에서는 필요 없다.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tri-chef-app:ci .
