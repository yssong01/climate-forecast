name: Refresh deploy data

# Streamlit Community Cloud 의 파일시스템은 휘발성이라, 앱이 실행 중에 쓴
# 데이터는 재시작하면 사라지고 저장소에 커밋된 내용으로 되돌아간다. 그래서
# "앱이 자기 데이터를 유지한다"가 아니라 "저장소가 원본이고 이 워크플로가
# 저장소를 갱신한다"로 구조를 잡는다.
#
# 갱신 대상 4개 (refresh_deploy_data.py · collect_nwp_archive.py · record_online_forecasts.py):
#   · cache/recent_window.json   — 최근 10일 관측 (스파크라인·추이 탭·API 장애 시 폴백 입력)
#   · cache/accuracy_log.json    — 적중률 로그(대기 항목 해소 + CI 온라인 예측 기록)
#   · cache/api_usage_daily.json — 인증키 유출 대응용 사용량 감시(README '인증키 관리' 참고)
#   · cache/nwp_recent.json      — 수치예보 창 (Open-Meteo, 기온 모델·GBM 의 입력 — 없으면 출력 불가)
#
# API 호출량: 관측소 12곳 × 경과 시간. 모든 관측이 제때 발표되면 **주기와
# 무관하게 하루 약 288건**이다 — 각 실행이 '마지막 관측 이후의 빈 시간'만 채우는
# 격차 보충 방식이라, 자주 돌리면 회당 건수가 그만큼 줄기 때문이다. 다만
# 결측 관측소가 생기면 그 공백을 매 실행 재요청해 하루 2,466건까지 갔다
# (2026-08-28 실측) — 지금은 탐침·재시도 1회·진짜 일일 상한(아래
# KMA_DAILY_CALL_BUDGET)으로 막는다(refresh_deploy_data.py 주석 참고).
#
# ── 왜 main 이 아니라 data 브랜치에 커밋하는가(2026-08-20) ──────────────
#
# 종전에는 main 에 커밋했다. 그러면 Streamlit Cloud 가 push 를 감지해 앱을
# 자동 재배포하는데, 이게 "최신성을 얼마나 자주 갱신할까"와 "재배포를 얼마나
# 자주 겪을까"를 강제로 묶어버린다 — 2026-08-19 에 6시간→2시간으로 줄인 것도
# 이 트레이드오프 때문이었다(재배포마다 캐시가 날아가고 수십 초 끊김).
#
# ASOS 관측 자체는 매시 정각 1회, 10분 후 공개되는 게 물리적 상한이라 이보다
# 훨씬 자주 갱신해봐야 새 데이터가 없다. 그런데도 예전엔 최신성을 높이려면
# 재배포 빈도를 함께 높여야 하는 구조였다.
#
# app.py 는 이제 recent_window.json 을 로컬 디스크가 아니라
# raw.githubusercontent.com 에서 이 data 브랜치 기준으로 직접 읽는다(5분
# 캐시). Streamlit Cloud 는 main 만 감시하므로, 이 브랜치에 아무리 자주
# 커밋해도 재배포가 발생하지 않는다 — 최신성과 재배포가 완전히 분리된다.
# main 의 cache/*.json 은 더 이상 이 워크플로가 갱신하지 않는다("마지막
# 재배포 시점의 스냅숏"으로 얼어붙는다 — app.py 의 raw URL 읽기가 실패할
# 때만 쓰는 최후 폴백이다).
#
# 대가: data 브랜치 히스토리가 하루 수십~백여 커밋씩 계속 쌓인다. 파일
# 자체는 작고(recent_window.json 수백KB) 얕은 클론(fetch-depth: 1)만
# 쓰므로 이 워크플로 실행 자체는 느려지지 않는다 — 커밋 개수가 아니라
# 저장소 전체 크기가 문제될 때(수만~수십만 커밋 누적) 재검토할 것.
#
# ── 15분 주기는 누가 실제로 지키는가(2026-08-20) ──────────────────────
#
# 아래 `schedule:` 은 55분 간격의 안전망일 뿐이다. 실제 15분 주기는
# 저장소 루트의 cloudflare-worker/ 가 Cron Trigger 로 이 워크플로의
# workflow_dispatch 를 호출해서 만든다 — GitHub Actions 자체의
# `schedule` 이벤트는 15분처럼 짧은 주기를 지키지 못하는 것으로
# 실측됐다(아래 schedule 절 주석 참고). 이 워크플로 코드 자체는 어느
# 쪽이 깨워도 동일하게 동작한다.

on:
  schedule:
    # cron 은 UTC 기준이다.
    #
    # 2026-08-20 에 2시간 → 15분으로 줄였다가, 같은 날 다시 55분으로
    # 늘렸다(정정) — GitHub Actions 의 `schedule` 이벤트는 15분 같은
    # 고빈도 주기를 지키지 않는다. GitHub 공식 문서도 "고부하 시간대(특히
    # 매시 정각)에는 지연될 수 있다"고 명시하고 있고, 실측으로도 15분 주기
    # 설정 후 실제 실행 간격이 20~81분이었다(API로 run 생성 시각 대조,
    # 2026-08-20). 즉 워크플로 자체는 항상 성공(초록불)해도 GitHub 이
    # 애초에 그 시각에 실행을 시작해주지 않는 것이라, 이 트리거만으로는
    # 15분 약속을 지킬 수 없다.
    #
    # 그래서 실제 15분 주기는 cloudflare-worker/ 의 Cron Trigger 가
    # workflow_dispatch 를 호출해 만든다(GitHub Actions 러너 큐와 무관하게
    # 동작해 정시성이 훨씬 높다). 이 `schedule` 은 그 경로가 죽었을 때만
    # 뒤를 받치는 안전망이라 55분으로 완화했다 — 매시 정각(가장 혼잡한
    # 시점)을 피하려 55분을 골랐다.
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "요청 건수만 계산하고 API 호출·커밋 없이 종료"
        type: boolean
        default: false

# 앞선 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다 — 같은 파일을 두
# 실행이 동시에 쓰면 나중 것이 앞선 수집분을 덮어쓴다. 15분 주기 + 실행
# 시간 1분 미만이라 겹칠 일은 거의 없지만, 안전장치로 유지한다.
concurrency:
  group: refresh-deploy-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 잡 전체 상한(2026-10-22). 평시 2~3분이다. 수치예보 요청이 300초씩
    # 매달리던 때 실행마다 10분을 넘겼는데, 상한이 없어 그런 실행이 다음
    # 15분 주기와 겹쳐 concurrency 대기열에 쌓였다.
    timeout-minutes: 20
    permissions:
      contents: write        # data 브랜치에 되커밋하기 위해 필요

    steps:
      # 코드(스크립트)는 main 에서 가져온다 — 이 브랜치가 최신 로직의
      # 원본이다. data 브랜치에는 코드를 두지 않는다(중복 방지).
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      # 데이터는 data 브랜치에서 가져온다 — 이게 갱신 대상이자 커밋 대상이다.
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # **배포와 같은 고정 명세를 쓴다(2026-10-22).** 종전에는 여기서 최신
      # torch·numpy 2.x 를 받아, 화면에 쓰일 온라인 예측을 배포(torch 2.6.0·
      # numpy<2)와 다른 스택으로 기록하고 있었다. 버전은 `requirements.txt`
      # 한 곳에서 읽는다 — 여기 따로 적으면 두 곳이 어긋난다.
      #
      # 관측 갱신은 torch 를 쓰지 않으므로 torch 는 **관측 커밋 뒤의 별도
      # 스텝**에서 받는다 — 종전에는 torch 설치가 실패하면(인덱스 장애 등)
      # 관측 갱신까지 함께 멈췄다.
      - name: Install collector dependencies
        run: |
          pip install $(grep -E '^(numpy|requests|python-dotenv)\b' code/requirements.txt)

      # 키가 없으면 RobustWeatherCollector 가 조용히 폴백으로 내려가
      # "성공 0건"인 채로 워크플로는 초록불이 된다. 그 상태를 실패로 만든다.
      - name: Verify API key is configured
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          if [ -z "$KMA_API_KEY" ]; then
            echo "::error::KMA_API_KEY 시크릿이 없습니다. \
          Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

      # cache/*.json 의 상대경로(weather_collector.py·accuracy.py·
      # refresh_deploy_data.py 전부 "./cache/..." 고정)를 그대로 살리려고
      # data/ 를 작업 디렉터리로 두고, 코드는 PYTHONPATH 로 찾게 한다.
      - name: Refresh window and resolve pending forecasts
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          # 이 잡은 배치라 관측 미발표 시 기다렸다 다시 받는 게 맞다
          # (기본값 60초 유지). 서빙(app.py)만 0으로 내린다.
          #
          # **하루 상한이다(2026-10-21부터).** 종전에는 프로세스 계수라 실행마다
          # 0으로 돌아가 실행당 상한이었다. 지금은 cache/api_usage_daily.json 의
          # 오늘 누계로 계수를 시작한다. 평시 약 300건의 3배 여유다. 결측
          # 관측소 탐침은 관측소당 실행마다 1건이라, 12곳 전부가 하루 종일
          # 결측이면 1,152건으로 이 상한에 걸려 그날 마지막 몇 시간은 탐침이
          # 멈춘다 — 전 관측소 장애라 받을 것이 없고, 최신성 게이트가
          # 빨간불로 알리며, 자정(KST)에 상한이 풀린다.
          KMA_DAILY_CALL_BUDGET: "1000"
          PYTHONPATH: ${{ github.workspace }}/code
        working-directory: data
        run: |
          python ${{ github.workspace }}/code/refresh_deploy_data.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # 관측을 **먼저** 커밋한다(2026-10-22). 종전에는 수치예보 수집·온라인
      # 기록이 끝난 뒤 한 번에 커밋해, 수치예보 요청이 매달리면(실측 매 실행
      # 10분 안팎) 갓 받은 관측이 그만큼 늦게 화면에 닿았다. 관측은 뒤의
      # 스텝과 무관하게 완결된 수집분이다. `!cancelled()` 인 이유는 아래 마지막
      # 커밋 스텝 주석과 같다(게이트 실패와 저장을 분리한다).
      - name: Commit observations to data 브랜치
        if: ${{ !cancelled() && !inputs.dry_run }}
        working-directory: data
        run: |
          bash ${{ github.workspace }}/code/.github/scripts/commit_data.sh \
            "데이터 갱신: 최근 관측 창 + 적중률 로그 대조 (자동)" \
            cache/recent_window.json cache/accuracy_log.json cache/api_usage_daily.json

      # 수치예보(NWP) 창 갱신(2026-09-06). 관측 갱신과 **분리된 스텝**이고
      # `!cancelled()` 를 붙인 이유는 아래 커밋 스텝과 같다 — 관측 쪽 최신성
      # 게이트가 실패하면 상태 함수 없는 스텝은 암묵적 success() 로 skipped
      # 되어, 아무 문제 없는 NWP 수집까지 함께 멈춘다(2026-08-18 사고와
      # 같은 기전).
      #
      # 이 API 는 인증키를 쓰지 않는다(Open-Meteo, CC BY 4.0). 12개 관측소를
      # 각각 1회씩 부르므로 15분 주기라도 하루 약 1,152회로 무료 한도
      # (10,000회/일)의 12% 수준이다.
      #
      # **실패를 삼키지 않는다(2026-09-07 정정).** 처음에는
      # `continue-on-error: true` 를 붙였는데, 그러면 Open-Meteo 가 막히거나
      # 응답 형식이 바뀌어도 워크플로는 계속 초록불이고 배포 화면만 조용히
      # 묵은 예보로 굴러간다 — 관측 창에는 최신성 게이트가 있는데 이 축에만
      # 없는 비대칭이었다. `collect_nwp_archive._freshness_gate` 가 미래
      # 예보 여유를 검사해 부족하면 종료코드 1 을 낸다.
      #
      # 게이트가 실패해도 **수집분은 아래 커밋 스텝이 `!cancelled()` 로
      # 보존한다** — 2026-08-18 에 배운 "저장과 경보를 분리한다" 원칙 그대로다.
      # 게이트는 저장이 끝난 뒤에 판정하므로 진척이 버려지지 않는다.
      #
      # 스텝 상한 5분(2026-10-22) — 요청 타임아웃을 30초로 줄였으므로 12곳이
      # 전부 재시도까지 실패해도 이 안에 끝난다. 넘기면 다른 원인이다.
      - name: Refresh NWP forecast window
        if: ${{ !cancelled() && !inputs.dry_run }}
        timeout-minutes: 5
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        working-directory: data
        run: |
          python ${{ github.workspace }}/code/collect_nwp_archive.py --incremental

      # 온라인 예측(아래)에만 필요하다. CPU 휠, 배포와 같은 파일(위 주석).
      - name: Install model dependencies (torch, 배포와 같은 휠)
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          pip install "$(grep -E '^torch @' code/requirements.txt)"
          python -c "import torch, numpy; print('torch', torch.__version__, '· numpy', numpy.__version__)"

      # 적중률 로그에 온라인 예측을 남긴다(2026-09-23 신설).
      #
      # 왜 여기인가 — 화면의 '출력값 적중률'은 지금까지 **구조적으로 영원히
      # 비어 있었다.** 기록을 만드는 주체가 배포 앱뿐이었는데, Streamlit
      # Cloud 의 파일시스템은 휘발성이라 그 기록이 저장소로 돌아오지 못한다.
      # 이 잡은 `accuracy.resolve_pending()` 으로 **대기 항목을 대조**하기만
      # 했으므로, 대조할 대기 항목 자체가 쌓이지 않았다. 관측 창을 방금
      # 갱신한 이 자리가 예측을 만들기에 가장 좋은 지점이다.
      #
      # **API 를 한 건도 더 쓰지 않는다.** 스크립트가 `KMA_API_KEY` 를 비워
      # 컬렉터를 폴백 경로로 보내고, 방금 갱신한 저장소 창의 실측만으로
      # 예측한다(12곳이 같은 시각이라 Re축 조건도 그대로 만족한다). 실행
      # 끝에 호출 수가 0인지 스스로 확인하고, 0이 아니면 실패로 끝난다 —
      # 15분마다 도는 잡이라 조용히 새면 하루 17,000건이 된다.
      #
      # 앞 스텝(수집·게이트)이 실패해도 돌린다. 관측 창은 그 경우에도 디스크에
      # 저장돼 있으므로 예측을 만들 수 있고, 아래 커밋 스텝이 결과를 보존한다 —
      # 2026-08-18에 배운 "게이트와 저장을 분리한다" 원칙 그대로다.
      - name: Record online forecasts
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        working-directory: data
        run: |
          python ${{ github.workspace }}/code/record_online_forecasts.py

      # 최신성 게이트가 실패해도(= 위 스텝 exit 1) 이 스텝은 반드시 돈다.
      #
      # 왜 `!cancelled()` 인가(2026-08-18, 실측으로 원인 규명): 종전 조건은
      # `${{ !inputs.dry_run }}` 뿐이었다. schedule 이벤트에서 inputs 는 비어
      # 있으므로 이 식 자체는 참인데도 스텝이 skipped 됐다 — GitHub Actions 는
      # 상태 함수(success/failure/always/cancelled)가 없는 `if` 에 암묵적으로
      # `success()` 를 AND 로 붙이기 때문이다. 그 결과 게이트가 한 번 실패하면
      # **이미 수집해 디스크에 저장까지 끝낸 관측이 커밋되지 않고 러너와 함께
      # 폐기**됐다. 저장소는 낡은 창 그대로 남고, 다음 실행도 같은 낡은 기준점
      # 에서 다시 시작한다.
      #
      # 즉 게이트는 제 역할(장애 감지)을 했으나, 실패 처리 방식이 부분 진척을
      # 통째로 버려 일시적 장애를 장기 정지로 키웠다. 그래서 **저장과 경보를
      # 분리한다** — 수집분은 상태와 무관하게 커밋하고(창은 항상 갈 수 있는
      # 데까지 전진), 묵음 여부는 위 스텝이 잡 전체를 빨간불로 만들어 알린다.
      # `always()` 대신 `!cancelled()` 를 쓰는 이유는 수동 취소 시까지
      # 커밋하지 않기 위함이다.
      - name: Commit refreshed data to data 브랜치 (게이트 실패와 무관하게 수집분 보존)
        if: ${{ !cancelled() && !inputs.dry_run }}
        working-directory: data
        run: |
          # 커밋·rebase·재시도 절차는 스크립트 안의 주석 참고.
          bash ${{ github.workspace }}/code/.github/scripts/commit_data.sh \
            "데이터 갱신: 수치예보 창 + 온라인 예측 기록 (자동)" \
            cache/recent_window.json cache/accuracy_log.json cache/api_usage_daily.json \
            -f:cache/nwp_recent.json
